# A TUI-only agent with a slow (2s) startup. Prompts wait for the declared readiness marker
# instead of a timer, so nothing is typed into a half-started screen.
name = "mock-pty"
display = "Mock (terminal only)"
protocol = "pty"
command = ["{fleet51}", "mock-agent", "--protocol", "pty"]
sandbox_image = "debian:stable-slim"

[pty]
ready_pattern = "mock> $"
idle_pattern = "mock> $"
