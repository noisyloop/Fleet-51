name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
    # Changes to documentation alone don't need a build.
    paths-ignore: ["**.md", "docs/**", "**.txt"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "**.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: End-to-end smoke test (stand-in Ollama)
        run: scripts/smoke.sh

  macos:
    name: macOS app (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Add both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal binary (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/fleet51 \
            target/aarch64-apple-darwin/release/fleet51 \
            target/x86_64-apple-darwin/release/fleet51
          lipo -info dist/fleet51
      - name: Unit tests on macOS (including the sandbox's limits)
        run: cargo test
      - name: End-to-end smoke test on macOS
        run: scripts/smoke.sh
      - name: Check a release tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml. The release was probably created from an older commit; delete it and its tag, then create it again from the latest main."
            exit 1
          fi
      - name: Package Fleet-51.dmg
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          packaging/macos/build-dmg.sh "$VERSION" dist/fleet51 dist/Fleet-51-macos.dmg
      - name: Check the packaged app runs
        run: |
          hdiutil attach dist/Fleet-51-macos.dmg -mountpoint /tmp/fleet51-dmg -nobrowse
          /tmp/fleet51-dmg/Fleet-51.app/Contents/Resources/fleet51 --version
          codesign --verify --deep /tmp/fleet51-dmg/Fleet-51.app
          lipo -info /tmp/fleet51-dmg/Fleet-51.app/Contents/MacOS/Fleet-51
          cp -R /tmp/fleet51-dmg/Fleet-51.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/fleet51-dmg
      - name: Launch the app and screenshot its window
        run: |
          APP="$RUNNER_TEMP/Fleet-51.app"
          open "$APP"
          for i in $(seq 60); do "$APP/Contents/Resources/fleet51" status >/dev/null 2>&1 && break; sleep 1; done
          "$APP/Contents/Resources/fleet51" status
          # No Ollama on the runner: the app must download the pinned build, verify it and start it.
          for i in $(seq 240); do "$APP/Contents/Resources/fleet51" status | grep -qE "models: (ready|failed)" && break; sleep 3; done
          "$APP/Contents/Resources/fleet51" status
          "$APP/Contents/Resources/fleet51" status | grep -q "models: ready (managed" || { cat ~/.fleet51/runtime/ollama.log || true; exit 1; }
          sleep 8
          pgrep -fl "Fleet-51.app/Contents/MacOS/Fleet-51"
          mkdir -p dist/screens
          screencapture -x dist/screens/app-window.png || echo "screenshot not permitted on this runner"
          "$APP/Contents/Resources/fleet51" down || true
          pkill -f "Fleet-51.app/Contents/MacOS/Fleet-51" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshot
          path: dist/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-51-macos
          path: dist/Fleet-51-macos.dmg
      # Merging a new version into main publishes it: no manual release needed.
      - name: Publish a release when main has a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish."
            exit 0
          fi
          gh release create "v$VERSION" dist/Fleet-51-macos.dmg --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Fleet-51 $VERSION" --generate-notes --latest
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fleet-51-macos.dmg
