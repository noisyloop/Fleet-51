name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
    # Changes to documentation alone don't need a build.
    paths-ignore: ["**.md", "docs/**", "**.txt"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "**.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: End-to-end smoke test (stand-in Ollama)
        run: scripts/smoke.sh

  macos:
    name: macOS app (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Add both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal binary (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/fleet51 \
            target/aarch64-apple-darwin/release/fleet51 \
            target/x86_64-apple-darwin/release/fleet51
          lipo -info dist/fleet51
      - name: Unit tests on macOS (including the sandbox's limits)
        run: cargo test
      - name: End-to-end smoke test on macOS
        run: scripts/smoke.sh
      - name: Package Fleet-51.dmg
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          packaging/macos/build-dmg.sh "$VERSION" dist/fleet51 dist/Fleet-51-macos.dmg
      - name: Check the packaged app runs
        run: |
          hdiutil attach dist/Fleet-51-macos.dmg -mountpoint /tmp/fleet51-dmg -nobrowse
          /tmp/fleet51-dmg/Fleet-51.app/Contents/Resources/fleet51 --version
          codesign --verify --deep /tmp/fleet51-dmg/Fleet-51.app
          lipo -info /tmp/fleet51-dmg/Fleet-51.app/Contents/MacOS/Fleet-51
          cp -R /tmp/fleet51-dmg/Fleet-51.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/fleet51-dmg
      - name: Launch the app and screenshot its window
        run: |
          APP="$RUNNER_TEMP/Fleet-51.app"
          open "$APP"
          for i in $(seq 60); do "$APP/Contents/Resources/fleet51" status >/dev/null 2>&1 && break; sleep 1; done
          "$APP/Contents/Resources/fleet51" status
          # No Ollama on the runner: the app must download the pinned build, verify it and start it.
          for i in $(seq 240); do "$APP/Contents/Resources/fleet51" status | grep -qE "models: (ready|failed)" && break; sleep 3; done
          "$APP/Contents/Resources/fleet51" status
          "$APP/Contents/Resources/fleet51" status | grep -q "models: ready (managed" || { cat ~/.fleet51/runtime/ollama.log || true; exit 1; }
          sleep 8
          pgrep -fl "Fleet-51.app/Contents/MacOS/Fleet-51"
          mkdir -p dist/screens
          screencapture -x dist/screens/app-window.png || echo "screenshot not permitted on this runner"
          "$APP/Contents/Resources/fleet51" down || true
          pkill -f "Fleet-51.app/Contents/MacOS/Fleet-51" || true
      - name: Update while the app is running; the new version takes over
        run: |
          install_app() {
            hdiutil attach dist/Fleet-51-macos.dmg -mountpoint /tmp/f51 -nobrowse >/dev/null
            rm -rf /Applications/Fleet-51.app && cp -R /tmp/f51/Fleet-51.app /Applications/
            hdiutil detach /tmp/f51 >/dev/null
          }
          F=/Applications/Fleet-51.app/Contents/Resources/fleet51
          health() { U=$("$F" url); curl -s -H "Authorization: Bearer $(cat ~/.fleet51/token)" "${U%%\?*}api/health"; }
          # An "older" copy: the build id includes the program's date.
          install_app
          touch -t 202601010000 "$F"
          open /Applications/Fleet-51.app
          for i in $(seq 90); do "$F" status 2>/dev/null | grep -q "models: ready" && break; sleep 2; done
          OLD=$(health | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')
          echo "running: $OLD"
          # Drag the new app over it, as from the .dmg; the old one keeps running.
          install_app
          NEW=""
          for i in $(seq 30); do
            sleep 1
            NEW=$(health 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])' 2>/dev/null || true)
            [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && break
          done
          echo "after the update: $NEW (${i}s)"
          [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] || { cat ~/.fleet51/daemon.log; exit 1; }
          # Opening it again shows the new interface.
          open /Applications/Fleet-51.app
          sleep 5
          U=$("$F" url); curl -s "${U%%\?*}" | grep -q 'id="model-cancel"' || { echo "the old interface is still served"; exit 1; }
          mkdir -p dist/screens
          screencapture -x dist/screens/mac-after-update.png || echo "screenshot not permitted on this runner"
          "$F" down || true
          pkill -f "Fleet-51.app/Contents/MacOS/Fleet-51" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshot
          path: dist/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-51-macos
          path: dist/Fleet-51-macos.dmg

  windows:
    name: Windows app (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint on Windows
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Unit tests on Windows
        run: cargo test
      - name: End-to-end smoke test on Windows (stand-in Ollama)
        shell: bash
        run: scripts/smoke.sh
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$version" "/DSourceDir=$PWD\target\release" "/O$PWD\dist" packaging\windows\fleet51.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\Fleet-51-windows-setup.exe
      - name: Install it, open the app, and check it sets itself up
        shell: pwsh
        run: |
          Start-Process dist\Fleet-51-windows-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Fleet-51"
          & "$app\fleet51.exe" --version
          Start-Process "$app\fleet51-app.exe"
          # A first launch must open the window, not just start the service.
          $window = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (Get-Process fleet51-app -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }) { $window = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $window) { Write-Output "The Fleet-51 window did not open"; exit 1 }
          # No Ollama on the runner: the app must download the pinned build, verify it and start it.
          $status = ""
          for ($i = 0; $i -lt 300; $i++) {
            $status = (& "$app\fleet51.exe" status 2>$null) -join "`n"
            if ($status -match "models: (ready|failed)") { break }
            Start-Sleep -Seconds 3
          }
          $status
          if ($status -notmatch "models: ready \(managed") {
            Get-Content "$env:USERPROFILE\.fleet51\runtime\ollama.log" -ErrorAction SilentlyContinue
            Get-Content "$env:USERPROFILE\.fleet51\daemon.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Start-Sleep -Seconds 5
          Get-Process fleet51-app
          & "$app\fleet51.exe" down
          Stop-Process -Name fleet51-app -ErrorAction SilentlyContinue
      - name: Install over a running older version; the new one takes over
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Fleet-51"
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          gh release download --repo $env:GITHUB_REPOSITORY --pattern Fleet-51-windows-setup.exe --dir prev
          Start-Process prev\Fleet-51-windows-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Process "$app\fleet51-app.exe"
          for ($i = 0; $i -lt 90; $i++) { if ((& "$app\fleet51.exe" status 2>$null) -match "models: ready") { break }; Start-Sleep -Seconds 2 }
          & "$app\fleet51.exe" status
          # Install this build while the older one runs, then open it as a person would.
          Start-Process dist\Fleet-51-windows-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Process "$app\fleet51-app.exe"
          $status = ""
          for ($i = 0; $i -lt 60; $i++) {
            $status = (& "$app\fleet51.exe" status 2>$null) -join "`n"
            if ($status -match "Fleet-51 $([regex]::Escape($v)) ") { break }
            Start-Sleep -Seconds 1
          }
          $status
          if ($status -notmatch "Fleet-51 $([regex]::Escape($v)) ") { Get-Content "$env:USERPROFILE\.fleet51\daemon.log"; throw "the new version did not take over" }
          $window = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (Get-Process fleet51-app -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }) { $window = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $window) { throw "the Fleet-51 window did not open" }
          $url = (& "$app\fleet51.exe" url).Split('?')[0]
          if ((Invoke-WebRequest $url -UseBasicParsing).Content -notmatch 'id="model-cancel"') { throw "the old interface is still served" }
          Start-Sleep -Seconds 5
          New-Item -ItemType Directory -Force dist\screens | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("dist\screens\windows-after-update.png")
          & "$app\fleet51.exe" down
          Stop-Process -Name fleet51-app -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: dist/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-51-windows
          path: dist/Fleet-51-windows-setup.exe

  iso:
    name: Bootable ISO (x86-64, for VirtualBox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Fleet-51 as one self-contained Linux program
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
      - name: Build the ISO (a small Debian live system)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:bookworm bash -c \
            "apt-get update -qq && apt-get install -y -qq live-build zstd curl ca-certificates >/dev/null && packaging/iso/build-iso.sh $VERSION target/x86_64-unknown-linux-musl/release/fleet51 dist/Fleet-51-x86_64.iso"
          sudo chown -R "$(id -u)" dist
      - name: Boot it twice with an empty disk; Fleet-51 starts and keeps its data
        run: |
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ACCEL=kvm; else ACCEL=tcg; fi
          qemu-img create -f qcow2 data.qcow2 8G
          boot() {
            qemu-system-x86_64 -accel $ACCEL -m 4096 -smp 2 -boot d -cdrom dist/Fleet-51-x86_64.iso \
              -drive file=data.qcow2,if=virtio -nic user,hostfwd=tcp:127.0.0.1:7499-:7499 \
              -display none -serial file:serial-$1.log -daemonize -pidfile qemu.pid
            for i in $(seq 240); do grep -q "fleet51-token:" serial-$1.log 2>/dev/null && break; sleep 2; done
            tail -40 serial-$1.log
            sed -n 's/.*fleet51-token: \([0-9a-f]*\).*/\1/p' serial-$1.log | tail -1 > token-$1
            [ -s token-$1 ] || { echo "Fleet-51 did not start in the VM"; exit 1; }
          }
          api() { curl -fsS -H "Authorization: Bearer $(cat token-1)" "http://127.0.0.1:7499$1"; }
          boot 1
          curl -fsS http://127.0.0.1:7499/ | grep -q 'id="setup"'
          for i in $(seq 120); do api /api/runtime | grep -q '"state":"ready"' && break; sleep 2; done
          api /api/runtime; echo
          api /api/runtime | grep -q '"state":"ready"' || { echo "the bundled Ollama did not start"; exit 1; }
          grep -q "kept on the attached disk" serial-1.log || { echo "the empty disk was not used"; exit 1; }
          kill "$(cat qemu.pid)"; sleep 5
          boot 2
          [ "$(cat token-1)" = "$(cat token-2)" ] || { echo "nothing was kept across a reboot"; exit 1; }
          kill "$(cat qemu.pid)"
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-51-iso
          path: dist/Fleet-51-x86_64.iso
          compression-level: 0

  release:
    name: Release
    needs: [test, macos, windows, iso]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Fleet-51-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Check a release tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml. The release was probably created from an older commit; delete it and its tag, then create it again from the latest main."
            exit 1
          fi
      # Merging a new version into main publishes it: no manual release needed.
      - name: Publish a release when main has a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish."
            exit 0
          fi
          gh release create "v$VERSION" dist/Fleet-51-macos.dmg dist/Fleet-51-windows-setup.exe dist/Fleet-51-x86_64.iso \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Fleet-51 $VERSION" --generate-notes --latest
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Fleet-51-macos.dmg
            dist/Fleet-51-windows-setup.exe
            dist/Fleet-51-x86_64.iso
