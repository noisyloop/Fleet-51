# Offline stand-in that speaks Claude's stream-json protocol. Used for demos and tests.
name = "mock-claude"
display = "Mock (Claude protocol)"
protocol = "claude-stream-json"
command = ["{fleet51}", "mock-agent", "--protocol", "claude"]
args = ["-p", "--input-format", "stream-json", "--output-format", "stream-json", "--verbose", "--replay-user-messages"]
resume_args = ["--resume", "{session}"]
model_args = ["--model", "{model}"]
account_env = "MOCK_ACCOUNT_DIR"
account_provider = "mock"
resume_portable = true
rate_limit_pattern = "(?i)(rate.?limit|usage limit)"
overlay_args = ["--settings", "{overlay}/settings.json"]
sandbox_image = "debian:stable-slim"

[permission_args]
default = []
auto = ["--permission-mode", "acceptEdits"]

[[overlay]]
path = "settings.json"
content = '''
{"hooks": {"Stop": [{"hooks": [{"type": "command", "command": "{fleet51} hook --session {id} --name stop"}]}]}}
'''
