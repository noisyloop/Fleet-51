# Fleet-51's built-in coding agent on a local Ollama server. Free and offline; any model you have
# pulled works (pick one with --model, or leave it out to use the first local model).
# Set OLLAMA_HOST if Ollama is not on 127.0.0.1:11434.
name = "ollama"
display = "Fleet-51 agent on Ollama"
protocol = "claude-stream-json"
command = ["{fleet51}", "agent", "--provider", "ollama", "--state-dir", "{overlay}", "--replay-user-messages"]
resume_args = ["--resume", "{session}"]
model_args = ["--model", "{model}"]
rate_limit_pattern = "(?i)(429|rate.?limit)"
install_hint = "install Ollama (https://ollama.com) and `ollama pull qwen3`"

[permission_args]
default = []
plan = ["--permission-mode", "plan"]
auto = []
yolo = []
