# The built-in agent on any OpenAI-compatible endpoint: LM Studio, vLLM, llama.cpp server,
# OpenRouter, OpenAI... Set OPENAI_BASE_URL (and OPENAI_API_KEY if it needs one), pass --model.
name = "openai-compatible"
display = "Fleet-51 agent on an OpenAI-compatible server"
protocol = "claude-stream-json"
command = ["{fleet51}", "agent", "--provider", "openai", "--state-dir", "{overlay}", "--replay-user-messages"]
resume_args = ["--resume", "{session}"]
model_args = ["--model", "{model}"]
rate_limit_pattern = "(?i)(429|rate.?limit|quota)"

[permission_args]
default = []
plan = ["--permission-mode", "plan"]
auto = []
yolo = []
