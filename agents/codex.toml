# Codex via `codex exec --json`: one structured process per turn, resumed by thread id.
name = "codex"
display = "Codex"
protocol = "codex-exec-json"
command = ["codex"]
prompt_args = ["exec", "--json", "--skip-git-repo-check", "{flags}", "{prompt}"]
resume_prompt_args = ["exec", "--json", "--skip-git-repo-check", "{flags}", "resume", "{session}", "{prompt}"]
model_args = ["-m", "{model}"]
account_env = "CODEX_HOME"
account_provider = "openai"
rate_limit_pattern = "(?i)(rate.?limit|usage limit|429)"
install_hint = "npm i -g @openai/codex"

[permission_args]
default = []
plan = ["--sandbox", "read-only"]
auto = ["--full-auto"]
yolo = ["--dangerously-bypass-approvals-and-sandbox"]
